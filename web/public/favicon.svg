<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NASA Sky Tracker">
  <defs>
    <radialGradient id="sky" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141432"/>
      <stop offset="60%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#04040c"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#sky)"/>
  <!-- tiny starfield pinpoints -->
  <circle cx="14" cy="12" r="0.9" fill="#f5f5fa" opacity="0.85"/>
  <circle cx="50" cy="16" r="0.7" fill="#f5f5fa" opacity="0.7"/>
  <circle cx="20" cy="50" r="0.8" fill="#f5f5fa" opacity="0.75"/>
  <circle cx="48" cy="48" r="0.6" fill="#f5f5fa" opacity="0.6"/>
  <circle cx="34" cy="10" r="0.6" fill="#f5f5fa" opacity="0.6"/>
  <!-- four-point cosmic star -->
  <path d="M32 8 L35.5 28.5 L56 32 L35.5 35.5 L32 56 L28.5 35.5 L8 32 L28.5 28.5 Z" fill="url(#star)"/>
  <circle cx="32" cy="32" r="3" fill="#f5f5fa"/>
</svg>
